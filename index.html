<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeeZee Toys — занимательно-замечательные игрушки</title>
<meta name="description" content="Авторские магнитные азбуки, календари, одевашки и сортеры BeeZee Toys из Петербурга, с 2017 года.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A44;--paper:#F9F7F7;--blue:#2A4FD0;--red:#C0392B}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Rubik,system-ui,sans-serif;overflow-x:hidden}
a{color:var(--ink)}a:hover{color:var(--red)}
.hand{font-family:Caveat,cursive}

header{position:relative;max-width:1320px;margin:0 auto;padding:18px 24px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
header img{display:block;width:112px;height:70px;object-fit:contain}
.since{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#5B6478}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:700;text-decoration:none;border:0;font-family:inherit;font-size:16px;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.btn:hover{transform:scale(1.06) rotate(-2deg)}
.btn-dark{background:var(--ink);color:var(--paper)}
.btn-dark:hover{color:var(--paper)}
.btn-ozon{background:#2A4FD0;color:#fff}.btn-ozon:hover{color:#fff}
.btn-wb{background:#7B2D8E;color:#fff}.btn-wb:hover{color:#fff}

main{position:relative;max-width:1320px;margin:0 auto;padding:0 16px 40px;display:flex;justify-content:center}

.house{position:relative;width:min(760px,94vw);aspect-ratio:1024/1536;animation:breathe 8s ease-in-out infinite}
.cam{position:absolute;inset:0}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.g{position:absolute;inset:0;pointer-events:none}
.hot{position:absolute;padding:0;margin:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;border-radius:48px;transition:box-shadow .35s,background-color .35s;-webkit-tap-highlight-color:transparent}
.hot:focus-visible{outline:none}
.g:hover .hot,.g:focus-within .hot,.g.on .hot{background-color:rgba(255,255,255,.10);box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),0 0 0 3px rgba(31,42,68,.12)}
.go{position:absolute;right:7%;bottom:10%;padding:8px 16px;border-radius:999px;background:var(--ink);color:var(--paper);font:700 15px Rubik,sans-serif;opacity:0;transform:translateY(8px) scale(.8);transition:all .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.g:hover .go,.g:focus-within .go,.g.on .go{opacity:1;transform:none}
.sp{position:absolute;width:24px;height:24px;opacity:0}
.g:hover .sp,.g.on .sp{animation:sparkle 1s ease-out infinite}
.g:hover .sp2,.g.on .sp2{animation-delay:.3s}
.g:hover .sp3,.g.on .sp3{animation-delay:.6s}

/* персонажи — покой */
.s-girl{transform-origin:35.2% 44.9%;animation:sway 3.4s ease-in-out infinite}
.k-girl{transform-origin:63.5% 65.1%;animation:typing 2.4s ease-in-out infinite}
.s-board{transform-origin:53.2% 44.9%}
.s-blocks{transform-origin:43.2% 44.7%}
/* персонажи — наведение мышкой (:hover) или тап на телефоне (.on) */
.g:hover .s-girl,.g:focus-within .s-girl,.g.on .s-girl{animation:hop 1.6s ease-in-out infinite}
.g:hover .s-board,.g:focus-within .s-board,.g.on .s-board{animation:wiggle .9s ease-in-out infinite}
.g:hover .s-blocks,.g:focus-within .s-blocks,.g.on .s-blocks{animation:boing .8s ease-in-out .15s infinite}
.g:hover .k-girl,.g:focus-within .k-girl,.g.on .k-girl{animation:nod 1.1s ease-in-out infinite}

/* бабушка с газетой: 4 кадра в одной полосе */
.sprite{position:absolute;background:url(img/pressa-granny.webp) 0 0/400% 100% no-repeat;pointer-events:none}
.p-granny{transform-origin:50% 100%;animation:sit 4s ease-in-out infinite}.g:hover .p-granny,.g:focus-within .p-granny,.g.on .p-granny{animation:read 2.88s step-end infinite,sit 4s ease-in-out infinite}
@keyframes read{0%{background-position:0 0}38%{background-position:33.333% 0}48%{background-position:66.667% 0}80%{background-position:100% 0}90%{background-position:0 0}100%{background-position:0 0}}
@keyframes sit{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.015)}}

/* девочка у зеркала: 4 кадра — держит платье, примеряет, кружится, в новом платье */
.o-girl{background-image:url(img/odevashki-girl.webp);transform-origin:50% 100%;animation:sit 3.6s ease-in-out infinite}.g:hover .o-girl,.g:focus-within .o-girl,.g.on .o-girl{animation:dress 3.2s step-end infinite,sit 3.6s ease-in-out infinite}
@keyframes dress{0%{background-position:0 0}25%{background-position:33.333% 0}42%{background-position:66.667% 0}55%{background-position:100% 0}92%{background-position:0 0}100%{background-position:0 0}}

/* вешалка с платьями: при наведении ездит вправо-влево, платья качаются по инерции
   кадры: 0 — центр, 1 — качнулись вправо, 2 — центр, 3 — качнулись влево */
.o-rack{background-image:url(img/odevashki-rack.webp)}.g:hover .o-rack,.g:focus-within .o-rack,.g.on .o-rack{animation:roll 3.2s ease-in-out infinite,inertia 3.2s step-end infinite}
@keyframes roll{0%,100%{transform:translateX(-12%)}50%{transform:translateX(12%)}}
@keyframes inertia{0%{background-position:100% 0}18%{background-position:0 0}38%{background-position:33.333% 0}68%{background-position:66.667% 0}88%{background-position:100% 0}100%{background-position:100% 0}}

/* Азбуки: буквы летают по этажу. Обёртка .fly двигается по маршруту, картинка внутри кувыркается.
   При наведении на комнату буквы подрастают. */
.fly{position:absolute;pointer-events:none;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.fly img{display:block;width:100%;height:100%;animation:tumble 5s ease-in-out infinite;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 2px 2px rgba(31,42,68,.35))}.g:hover .fly,.g:focus-within .fly,.g.on .fly{transform:scale(1.3)}
.fly-a{width:4.52%;height:2.99%;animation:fly-a 13s ease-in-out infinite}
.fly-b{width:3.47%;height:2.99%;animation:fly-b 15s ease-in-out -4s infinite}
.fly-v{width:3.53%;height:2.99%;animation:fly-v 11s ease-in-out -2s infinite}
.fly-g{width:2.96%;height:2.99%;animation:fly-g 17s ease-in-out -7s infinite}
.fly-b img{animation-duration:6.2s;animation-direction:reverse}
.fly-v img{animation-duration:4.4s;animation-delay:-1.5s}
.fly-g img{animation-duration:7s;animation-direction:reverse;animation-delay:-3s}
@keyframes tumble{0%,100%{transform:rotate(-14deg)}25%{transform:rotate(10deg) translateY(-10%)}50%{transform:rotate(-6deg)}75%{transform:rotate(16deg) translateY(8%)}}
.fly-d{width:4.22%;height:2.99%;animation:fly-d 19s ease-in-out -11s infinite}
.fly-d img{animation-duration:5.8s;animation-delay:-2.5s}
@keyframes fly-d{0.0%{left:45.90%;top:9.11%} 16.7%{left:58.59%;top:11.72%} 33.3%{left:50.78%;top:12.50%} 50.0%{left:37.11%;top:11.07%} 66.7%{left:32.23%;top:12.11%} 83.3%{left:41.02%;top:9.77%} 100.0%{left:45.90%;top:9.11%}}
@keyframes fly-a{0.0%{left:31.05%;top:11.85%} 16.7%{left:34.18%;top:8.79%} 33.3%{left:50.78%;top:10.94%} 50.0%{left:58.59%;top:12.11%} 66.7%{left:45.90%;top:11.85%} 83.3%{left:33.69%;top:10.42%} 100.0%{left:31.05%;top:11.85%}}
@keyframes fly-b{0.0%{left:58.11%;top:10.74%} 16.7%{left:48.83%;top:12.24%} 33.3%{left:36.13%;top:11.59%} 50.0%{left:32.71%;top:8.79%} 66.7%{left:43.46%;top:10.94%} 83.3%{left:54.69%;top:12.11%} 100.0%{left:58.11%;top:10.74%}}
@keyframes fly-v{0.0%{left:41.02%;top:12.24%} 16.7%{left:54.20%;top:10.74%} 33.3%{left:59.77%;top:11.98%} 50.0%{left:48.83%;top:12.24%} 66.7%{left:34.38%;top:9.24%} 83.3%{left:31.25%;top:11.72%} 100.0%{left:41.02%;top:12.24%}}
@keyframes fly-g{0.0%{left:50.78%;top:12.11%} 16.7%{left:35.64%;top:12.24%} 33.3%{left:32.23%;top:9.11%} 50.0%{left:44.43%;top:10.74%} 66.7%{left:59.38%;top:10.94%} 83.3%{left:52.73%;top:12.24%} 100.0%{left:50.78%;top:12.11%}}

/* Календари: настольный календарь. Кадры: 0 зима, 1 весна, 2 лето, 3 осень.
   В покое показывает текущее время года (выставляет скрипт), при наведении листает сезоны. */
.k-cal{background-image:url(img/kalendari-cal.webp);transform-origin:50% 12%}
.g:hover .k-cal,.g:focus-within .k-cal,.g.on .k-cal{animation:seasons 4.8s step-end infinite,pageflip 4.8s ease-out infinite}
@keyframes seasons{0%{background-position:0 0}25%{background-position:33.333% 0}50%{background-position:66.667% 0}75%{background-position:100% 0}100%{background-position:0 0}}
@keyframes pageflip{0%,25%,50%,75%,100%{transform:scaleY(.86) translateY(-2%)}6%,31%,56%,81%{transform:scaleY(1.03)}10%,35%,60%,85%{transform:none}}

/* Пазлы: кадры 0 разбросаны, 1 ближе, 2 почти, 3 собраны.
   В покое лежат разбросанными, при наведении собираются, щёлкают и снова рассыпаются. */
.z-pieces{background-image:url(img/pazly-pieces.webp);transform-origin:50% 60%}
.g:hover .z-pieces,.g:focus-within .z-pieces,.g.on .z-pieces{animation:assemble 3.6s step-end infinite,snap 3.6s ease-out infinite}
@keyframes assemble{0%{background-position:0 0}16%{background-position:33.333% 0}30%{background-position:66.667% 0}42%{background-position:100% 0}88%{background-position:0 0}100%{background-position:0 0}}
@keyframes snap{0%,41%{transform:none}46%{transform:scale(1.08)}52%{transform:scale(.97)}58%,86%{transform:none}90%{transform:scale(1.04) rotate(-2deg)}100%{transform:none}}

/* Контакты: по комнате летают конверты (та же механика, что у букв в «Азбуках») */
.fly-e1{width:5.08%;height:2.39%;animation:fly-e1 14s ease-in-out infinite}
.fly-e2{width:4.88%;height:2.33%;animation:fly-e2 12s ease-in-out -5s infinite}
.fly-e3{width:4.10%;height:1.93%;animation:fly-e3 16s ease-in-out -9s infinite}
.fly-e2 img{animation-duration:5.6s;animation-direction:reverse}
.fly-e3 img{animation-duration:4.6s;animation-delay:-2s;scale:-1 1}
@keyframes fly-e1{0.0%{left:30.27%;top:60.55%} 16.7%{left:37.11%;top:58.92%} 33.3%{left:45.90%;top:60.22%} 50.0%{left:48.83%;top:61.52%} 66.7%{left:41.02%;top:61.85%} 83.3%{left:32.23%;top:59.24%} 100.0%{left:30.27%;top:60.55%}}
@keyframes fly-e2{0.0%{left:46.88%;top:60.87%} 16.7%{left:39.06%;top:61.72%} 33.3%{left:31.25%;top:61.20%} 50.0%{left:32.23%;top:57.62%} 66.7%{left:40.04%;top:59.57%} 83.3%{left:48.34%;top:59.90%} 100.0%{left:46.88%;top:60.87%}}
@keyframes fly-e3{0.0%{left:37.11%;top:61.52%} 16.7%{left:44.92%;top:59.24%} 33.3%{left:49.32%;top:60.87%} 50.0%{left:41.99%;top:61.98%} 66.7%{left:33.20%;top:60.22%} 83.3%{left:29.79%;top:61.85%} 100.0%{left:37.11%;top:61.52%}}

/* История: мама-основательница мастерит игрушку. Кадры: 0 замах, 1 опускает, 2 удар, 3 отскок.
   В покое держит молоток наготове, при наведении стучит; в момент удара — жёлтый «бам». */
.h-mom{background-image:url(img/istoriya-mom.webp);background-position:33.333% 0;transform-origin:40% 100%;animation:sit 4.2s ease-in-out infinite}
.g:hover .h-mom,.g:focus-within .h-mom,.g.on .h-mom{animation:hammer 1.3s step-end infinite}
@keyframes hammer{0%{background-position:0 0}40%{background-position:33.333% 0}55%{background-position:66.667% 0}72%{background-position:100% 0}100%{background-position:0 0}}
.bam{position:absolute;opacity:0;pointer-events:none}
.g:hover .bam,.g:focus-within .bam,.g.on .bam{animation:bam 1.3s linear infinite}
@keyframes bam{0%,54%{opacity:0;transform:scale(.4)}57%{opacity:1;transform:scale(1.15)}68%{opacity:1;transform:scale(1)}74%,100%{opacity:0;transform:scale(.9)}}

/* История: малыш ползёт к маме. Кадры: 0 и 2 — на четвереньках, 1 и 3 — тянет ручку вперёд.
   В покое сидит и «дышит», при наведении перебирает ручками и подползает к маме. */
.h-baby{background-image:url(img/istoriya-baby.webp);transform-origin:50% 100%;animation:sit 3s ease-in-out infinite}
.g:hover .h-baby,.g:focus-within .h-baby,.g.on .h-baby{animation:crawl 1.2s step-end infinite,toMom 3.2s ease-in-out forwards}
@keyframes crawl{0%{background-position:0 0}25%{background-position:33.333% 0}50%{background-position:66.667% 0}75%{background-position:100% 0}100%{background-position:0 0}}
@keyframes toMom{from{transform:translateX(0)}to{transform:translateX(-55%)}}

/* Календари: маленький календарик у окна. В покое стоит на полу, при наведении или тапе взлетает и кружит по комнате */
.k-mini{position:absolute;left:33.69%;top:21.55%;width:6.05%;height:3.45%;pointer-events:none}
.k-mini img{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(31,42,68,.3))}
.g:hover .k-mini,.g:focus-within .k-mini,.g.on .k-mini{animation:miniFly 6s ease-in-out infinite}
.g:hover .k-mini img,.g:focus-within .k-mini img,.g.on .k-mini img{animation:tumble 3s ease-in-out infinite}
@keyframes miniFly{0.0%{left:33.69%;top:21.55%} 20.0%{left:41.02%;top:20.70%} 40.0%{left:48.83%;top:19.53%} 60.0%{left:45.90%;top:21.61%} 80.0%{left:37.60%;top:20.96%} 100.0%{left:33.69%;top:21.55%}}
/* большой календарь отражён — «смотрит» от окна */
.k-cal{scale:-1 1}

.puff{position:absolute;left:66.2%;top:5.2%;aspect-ratio:1;border-radius:50%;animation:rise 3.6s ease-out infinite}
.leaf{position:absolute;animation:fall 9s linear infinite}

footer{max-width:1320px;margin:0 auto;padding:24px 24px 48px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 28px}

/* окно раздела */
.panel-wrap{position:fixed;inset:0;z-index:50;background:rgba(31,42,68,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.panel-wrap.open{display:flex;animation:fade .3s ease}
.panel{width:100%;max-width:980px;background:var(--paper);border-radius:40px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:panelIn .55s cubic-bezier(.34,1.56,.64,1)}
.panel-head{color:#fff;padding:28px clamp(24px,4vw,48px) 32px;display:flex;flex-direction:column;gap:14px}
.panel-head .btn{align-self:flex-start;background:var(--paper);color:var(--ink);min-height:44px;padding:0 20px}
.panel-head .note{font-size:30px;line-height:1}
.panel-head h2{margin:0;font-size:clamp(40px,6vw,72px);font-weight:800;line-height:.95}
.panel-head p{margin:0;font-size:19px;line-height:1.5;max-width:640px}
.panel-body{padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:28px}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.photos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:22px;border:6px solid #fff}
.ph{border-radius:24px;min-height:240px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background-color:#F3EBDD;background-image:radial-gradient(circle,#E8DCC6 0 8px,transparent 9px);background-size:40px 40px}
.ph span{background:var(--paper);border-radius:14px;padding:10px 16px;font-size:15px;font-weight:500}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.item{background:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:8px}
.item .tag{font-size:14px;font-weight:700}
.item strong{font-size:20px;line-height:1.25}
.item span.t{font-size:16px;line-height:1.5}
.buy{display:flex;flex-wrap:wrap;gap:12px}

/* телефоны: дом крупнее экрана, листья по краям уходят за границу */
@media (max-width:640px){
  header{padding:14px 16px 6px}
  header img{width:96px;height:60px}
  main{padding:0 0 28px;overflow:hidden}
  .house{width:131vw;flex:none;left:3.45vw}
  /* конверты мелкие — белый контур толще и плотнее, как у наклейки (буквы — без обводки) */
  .g[data-room="kon"] .fly img{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 2px 2px rgba(31,42,68,.35))} /* сдвиг: розовые лестницы слева и справа на равном расстоянии от краёв экрана */
}

@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes typing{0%,100%{transform:translateY(0)}50%{transform:translateY(-.25%)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.03,.96)}32%{transform:translateY(-1.8%) scale(.98,1.03) rotate(-3deg)}52%{transform:translateY(0) rotate(1deg)}60%{transform:translateY(0) scale(1.03,.96)}68%,100%{transform:translateY(0) scale(1,1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes boing{0%,100%{transform:translateY(0)}40%{transform:translateY(-1.3%) rotate(-6deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-2deg) translateY(-.2%)}60%{transform:rotate(1deg)}}
@keyframes sparkle{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1.2) rotate(40deg)}100%{opacity:0;transform:scale(.6) translateY(-26px) rotate(90deg)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(60px,520px) rotate(320deg);opacity:0}}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:.85}100%{transform:translate(18px,-90px) scale(1.6);opacity:0}}
@keyframes nudge{0%,100%{transform:rotate(-5deg) translateX(0)}50%{transform:rotate(-3deg) translateX(10px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(60px) scale(.92)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header>
<a href="./" aria-label="BeeZee Toys — на главную"><img src="img/logo.webp" alt="BeeZee Toys"></a>
<span class="since">Производитель игрушек с 2017 г.</span>
</header>

<main>

<div class="house">
<div class="cam" id="cam">
<img class="layer" src="img/house.webp" alt="Дом BeeZee: этажи Азбуки, Календари, Пазлы, Сортеры, Одевашки, Контакты, История, Пресса">

<span class="puff" style="width:4%;background:#CFE6F7"></span>
<span class="puff" style="width:3.4%;background:#E4F1FB;animation-delay:-1.2s"></span>
<span class="puff" style="width:2.8%;background:#B9DAF2;animation-delay:-2.4s"></span>

<svg class="leaf" viewBox="0 0 20 20" style="left:8%;top:16%;width:3%" aria-hidden="true"><path d="M10 1C17 6 17 14 10 19 3 14 3 6 10 1Z" fill="#F28C28"/></svg>

<div class="panel-wrap" id="panel" role="dialog" aria-modal="true"></div>

<script>
const W = 1024, H = 1536;
const TOUCH = matchMedia('(hover: none)').matches;

// календарь в покое показывает текущее время года
(() => {
  const m = new Date().getMonth();                 // 0 — январь
  const season = [0,0,1,1,1,2,2,2,3,3,3,0][m];     // 0 зима, 1 весна, 2 лето, 3 осень
  document.getElementById('cal').style.backgroundPosition = (season * 100 / 3) + '% 0';
})();
const ROOMS = {
  azb: { name: 'Азбуки', color: '#D8467F', note: 'хит BeeZee', lead: 'Глянцевые магнитные буквы в горошек, облака и звёзды. Прочные, экологичные, сплошной магнит.', buy: true,
    photos: [['azbuka-tuba','Магнитная азбука в тубе, 54 буквы'],['azbuka-dom','Буквы Д, О, М и фигурки'],['azbuka-papa','Буквы ПАПА на холодильнике'],['azbuka-ch','Розовая буква Ч в цветочек'],['azbuka-girl','Девочка с тубой магнитной азбуки']] },
  kal: { name: 'Календари', color: '#7C5BC9', note: 'утро начинается с игры', lead: 'Магнитно-маркерные календари: дни недели, погода и числа.', ph: 'Фото серии загрузим из папки img/kalendari', buy: true },
  paz: { name: 'Пазлы', color: '#2A4FD0', note: 'собери, если сможешь', lead: 'Головоломки, которые увлекают надолго и развивают пространственное мышление.', ph: 'Фото серии загрузим из папки img/pazly', buy: true },
  sor: { name: 'Сортеры', color: '#D9577F', note: 'цвета, формы и счёт', lead: 'Сортеры и балансиры в духе Монтессори для самых маленьких.', ph: 'Фото серии загрузим из папки img/sortery', buy: true },
  ode: { name: 'Одевашки', color: '#8550C2', note: 'гардероб на все случаи', lead: 'Магнитные одевашки: целые семьи героев и наряды на каждый день.', ph: 'Фото серии загрузим из папки img/odevashki', buy: true },
  kon: { name: 'Контакты', color: '#3A6FD0', note: 'пишите, мы отвечаем', lead: 'Вопросы, опт и серии под заказ — пишите в почту или в соцсети.',
    items: [['Почта','toys@beezeetoys.ru','Ответим на вопросы, опт и заказы.'],['ВКонтакте','vk.ru/public194457043','Новинки и розыгрыши.'],['Instagram','@beezee_toys','Фото и видео игрушек в деле.']] },
  ist: { name: 'История', color: '#A2476F', note: 'как всё начиналось', lead: 'Город на Неве, где солнца мало, а детей очень любят.',
    items: [['2017','Идея','Питерская мама двоих детей решила: качественных и необычных игрушек много не бывает.'],['2017','«Читазл»','Первые деревянные азбуки пахли копотью — мы не сдались. Домино-пазл в жестяной баночке стал первым хитом.'],['2018','Оргстекло','Год экспериментов: сотни глянцевых магнитных азбук, цифр и мемо.'],['2019','Своя марка','Торговый знак, сертификаты, фабрики-партнёры и выход на маркетплейсы.']] },
  pre: { name: 'Пресса', color: '#D83A2E', note: 'мы даже на обложке!', lead: 'Что о BeeZee Toys пишет деловая пресса.',
    items: [['Бизнес-Диалог · июнь 2023','BeeZee Toys на обложке','Обложку и разворот перенесём с текущего сайта.'],['Russian Business Guide · март 2023','Статья Ru-Eng','Сканы страниц перенесём с текущего сайта.'],['Деловой Петербург · ноябрь 2019','«В Европу со своим деревом»','Как петербургский бренд игрушек собрался на зарубежный рынок.']] }
};

const panel = document.getElementById('panel');
const star = (c, pos, cls) => `<svg class="sp ${cls}" viewBox="0 0 24 24" aria-hidden="true" style="${pos}"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="${c}"/></svg>`;

// Ставим кнопки-«двери» поверх каждой комнаты
document.querySelectorAll('.g').forEach((g) => {
  const id = g.dataset.room, r = ROOMS[id];
  const [x1, y1, x2, y2] = g.dataset.box.split(',').map(Number);
  const l = x1 / W * 100, t = y1 / H * 100, w = (x2 - x1) / W * 100, h = (y2 - y1) / H * 100;
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'hot';
  b.setAttribute('aria-label', 'Открыть раздел ' + r.name);
  b.style.cssText = `left:${l}%;top:${t}%;width:${w}%;height:${h}%`;
  b.innerHTML = star('#F6C945', 'left:4%;top:8%', '') + star('#3FB8C5', 'right:6%;top:12%', 'sp2') + star('#E8559A', 'left:46%;bottom:8%', 'sp3') + '<span class="go">Войти →</span>';
  b.addEventListener('click', () => {
    // на телефоне первый тап оживляет комнату, второй — открывает раздел
    if (TOUCH && !g.classList.contains('on')) {
      document.querySelectorAll('.g.on').forEach((x) => x.classList.remove('on'));
      g.classList.add('on');
      return;
    }
    enter(id);
  });
  g.appendChild(b);
});

function enter(id) { openPanel(ROOMS[id]); }

function openPanel(r) {
  let body = '';
  if (r.photos) body += '<div class="photos">' + r.photos.map(([f, alt]) => `<img src="img/${f}.webp" alt="${alt}">`).join('') + '</div>';
  if (r.ph) body += `<div class="ph"><span>${r.ph}</span></div>`;
  if (r.items) body += '<div class="items">' + r.items.map(([tag, title, text]) => `<div class="item"><span class="tag" style="color:${r.color}">${tag}</span><strong>${title}</strong><span class="t">${text}</span></div>`).join('') + '</div>';
  if (r.buy) body += '<div class="buy"><a class="btn btn-ozon" href="#ozon">Купить на Ozon</a><a class="btn btn-wb" href="#wb">Купить на Wildberries</a></div>';
  panel.innerHTML = `<div class="panel"><div class="panel-head" style="background:${r.color}"><button type="button" class="btn" id="close">← Вернуться в дом</button><span class="note hand">${r.note}</span><h2>${r.name}</h2><p>${r.lead}</p></div><div class="panel-body">${body}</div></div>`;
  panel.setAttribute('aria-label', r.name);
  panel.classList.add('open');
  document.getElementById('close').focus();
}

// тап мимо комнат «усыпляет» оживлённую комнату
document.addEventListener('click', (e) => {
  if (!e.target.closest('.hot')) document.querySelectorAll('.g.on').forEach((x) => x.classList.remove('on'));
});

function closePanel() { panel.classList.remove('open'); panel.innerHTML = ''; document.querySelectorAll('.g.on').forEach((x) => x.classList.remove('on')); }
panel.addEventListener('click', (e) => { if (e.target === panel || e.target.id === 'close') closePanel(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });
</script>
